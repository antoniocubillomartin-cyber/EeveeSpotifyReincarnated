name: Create IPA Packages

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to a decrypted Spotify IPA"
        default: ""
        required: true
        type: string
      tweak_url:
        description: "URL to a prebuilt EeveeSpotify .deb"
        default: ""
        required: true
        type: string
      upload_method:
        description: "Where to upload the built IPA(s)"
        default: "artifacts"
        required: true
        type: choice
        options:
          - artifacts
          - filebin
          - both

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  inject:
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Download IPA
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O ${{ github.workspace }}/spotify.ipa
          file_type=$(file --mime-type -b ${{ github.workspace }}/spotify.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Not a valid IPA: $file_type"; exit 1
          fi

      - name: Download .deb
        run: |
          wget "${{ inputs.tweak_url }}" --no-verbose -O ${{ github.workspace }}/eevee.deb
          file_type=$(file --mime-type -b ${{ github.workspace }}/eevee.deb)
          if [[ "$file_type" != "application/vnd.debian.binary-package" ]]; then
            echo "::error::Not a valid .deb: $file_type"; exit 1
          fi

      - name: Setup Theos (only needed for zxPluginsInject build)
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git
          # releases/latest/download redirect avoids api.github.com rate limit (anon 60/hr -> 403)
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
              -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch

      - name: Build zxPluginsInject.dylib
        run: |
          chmod +x Tools/build-zxpi.sh
          Tools/build-zxpi.sh

      - name: Inject deb into IPA (cyan)
        run: |
          mkdir -p Outputs/IPAS
          DEB_EXTRACT="$RUNNER_TEMP/deb-extract"; mkdir -p "$DEB_EXTRACT"
          dpkg-deb -R ${{ github.workspace }}/eevee.deb "$DEB_EXTRACT"

          DYLIB_SRC=$(find "$DEB_EXTRACT" -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)

          SPOT_VERSION=$(unzip -p ${{ github.workspace }}/spotify.ipa 'Payload/Spotify.app/Info.plist' \
              | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || echo "unknown")
          OUT="Outputs/IPAS/EeveeSpotify-${SPOT_VERSION}.ipa"

          INJECT=("$DYLIB_SRC")
          [ -n "$FRAMEWORK_SRC" ] && INJECT+=("$FRAMEWORK_SRC")
          [ -n "$BUNDLE_SRC" ]    && INJECT+=("$BUNDLE_SRC")

          cyan -i ${{ github.workspace }}/spotify.ipa -o "$OUT" \
               -f "${INJECT[@]}" -c 9 -m 15.0 -du
          echo "OUT_IPA=$OUT" >> $GITHUB_ENV

      - name: Fetch OpeninSafariSpotify extension (.appex)
        run: |
          # "OpeninSafariSpotify" is commonly distributed as OpenSpotifySafariExtension.appex
          EXT_DIR="$RUNNER_TEMP/OpenSpotifySafariExtension"
          
          rm -rf "$EXT_DIR"
          git clone --depth 1 https://github.com/BillyCurtis/OpenSpotifySafariExtension.git "$EXT_DIR"
          EXT_SRC="$EXT_DIR/OpenSpotifySafariExtension.appex"
          [ -e "$EXT_SRC" ] || { echo "OpenSpotifySafariExtension.appex not found in repo" >&2; exit 1; }
          echo "OPENSPOTIFY_APPEX=$EXT_SRC" >> $GITHUB_ENV

      
      - name: Inject OpeninSafariSpotify & remove Watch app
        run: |
          cd "$(dirname "$OUT_IPA")"

          IPA_NAME="$(basename "$OUT_IPA")"

          # Extract IPA
          rm -rf Payload
          unzip -q "$IPA_NAME"

          # Inject Safari extension
          mkdir -p "Payload/Spotify.app/PlugIns"
          rm -rf "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"
          cp -R "$OPENSPOTIFY_APPEX" \
            "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"

          # Remove Apple Watch components
          rm -rf "Payload/Spotify.app/Watch"
          rm -rf "Payload/Spotify.app/com.apple.WatchPlaceholder"

          # Remove any remaining WatchKit application bundles
          find "Payload/Spotify.app" -name Info.plist -print0 |
          while IFS= read -r -d '' PLIST; do

            WATCH_ID=$(
              /usr/libexec/PlistBuddy \
              -c "Print :WKCompanionAppBundleIdentifier" \
              "$PLIST" 2>/dev/null || true
            )

            WATCH_APP=$(
              /usr/libexec/PlistBuddy \
              -c "Print :WKWatchKitApp" \
              "$PLIST" 2>/dev/null || true
            )

            if [[ -n "$WATCH_ID" || "$WATCH_APP" == "true" ]]; then
              APP_DIR="$(dirname "$PLIST")"

              echo "Removing WatchKit component: $APP_DIR"
              rm -rf "$APP_DIR"
            fi
          done

          # IMPORTANT: recreate IPA from scratch
          rm -f "$IPA_NAME"
          zip -qry "$IPA_NAME" Payload

          # Verify that no WatchKit companion remains
          if unzip -Z1 "$IPA_NAME" | grep -E 'Watch/.*\.app/Info.plist'; then
            echo "::error::Watch app still present in IPA"
            exit 1
          fi

          rm -rf Payload

          echo "Apple Watch components removed successfully"

      - name: Create Patched Duplicate & LC-inject zxPluginsInject
        run: |
          PATCHED_OUT="${OUT_IPA%.ipa}-patched.ipa"
          cp "$OUT_IPA" "$PATCHED_OUT"
          ipapatch --input "$PATCHED_OUT" --inplace --noconfirm \
                   --dylib packages/zxPluginsInject.dylib
          echo "PATCHED_IPA=$PATCHED_OUT" >> $GITHUB_ENV

      - name: Stage alternate app icons
        run: |
          chmod +x Tools/alt-icons.sh
          Tools/alt-icons.sh "$OUT_IPA"

      - name: Upload IPA artifact
        if: ${{ inputs.upload_method == 'artifacts' || inputs.upload_method == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-IPA
          path: |
            ${{ env.OUT_IPA }}
            ${{ env.PATCHED_OUT }}
          if-no-files-found: error

      - name: Upload IPA(s) to filebin.net
        if: ${{ inputs.upload_method == 'filebin' || inputs.upload_method == 'both' }}
        run: |
          BIN="eevee-${{ github.run_id }}-${{ github.run_attempt }}"
          {
            echo "### 📦 filebin.net download"
          } >> "$GITHUB_STEP_SUMMARY"
          for IPA_PATH in "$OUT_IPA" "$PATCHED_OUT"; do
            [ -n "$IPA_PATH" ] || continue
            FILENAME=$(basename "$IPA_PATH")
            curl -fsS -X POST \
                 -H "Content-Type: application/octet-stream" \
                 --data-binary "@${IPA_PATH}" \
                 "https://filebin.net/${BIN}/${FILENAME}" >/dev/null
            DOWNLOAD_URL="https://filebin.net/${BIN}/${FILENAME}"
            echo "Uploaded to: ${DOWNLOAD_URL}"
            echo "- **${FILENAME}:** ${DOWNLOAD_URL}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _Filebin auto-deletes bins after a period of inactivity — download promptly._" >> "$GITHUB_STEP_SUMMARY"
